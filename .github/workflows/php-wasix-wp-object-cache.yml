name: Rust object cache through PHP WASIX
'on':
  push:
    branches:
    - dev/v0.5
    paths:
    - .github/workflows/php-wasix-wp-object-cache.yml
    - experiments/php-wasix-wp-object-cache-probe/**
    - '!experiments/php-wasix-wp-object-cache-probe/evidence/**'
    - '!experiments/php-wasix-wp-object-cache-probe/import_evidence.py'
    - '!experiments/php-wasix-wp-object-cache-probe/README.ja.md'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: wordpress-wasix-object-cache-${{ github.sha }}
  cancel-in-progress: false
jobs:
  cache:
    name: Compare owned Rust object cache in two fresh PHP-Wasm requests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.94.0
    defaults:
      run:
        shell: bash
    steps:
    - name: Check out fixed experiment inputs
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Check out the fixed PHP source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: wasix-org/php
        ref: f4bfae79d5c19028349082f707930cf0951d23b9
        path: target/php-wasix-managed-access-probe/source/php
        persist-credentials: false
    - name: Check out fixed WASIX dependencies
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: wasix-org/php-wasix-deps
        ref: b77ecbede97aba2df32c86eaeb54ff9f5e44f543
        path: target/php-wasix-managed-access-probe/source/php-wasix-deps
        persist-credentials: false
    - name: Preseed the fixed parser
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: nikic/PHP-Parser
        ref: f103601b29efebd7ff4a1ca7b3eeea9e3336a2a2
        path: target/php-wasix-managed-access-probe/source/php/build/PHP-Parser-5.6.1
        persist-credentials: false
    - name: Install native build tools only
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          build-essential autoconf automake bison re2c pkg-config wabt \
          curl xz-utils tar php-cli php-xml cmake ninja-build \
          libzstd-dev zlib1g-dev libxml2-dev libncurses-dev libffi-dev
    - name: Verify and place fixed WASIX tools
      run: python3 experiments/php-wasix-cgi-build/prepare.py --record
    - name: Build the same three-patch PHP CGI candidate
      run: python3 experiments/php-wasix-managed-access-probe/build.py --record
    - name: Prepare the fixed stock WordPress source
      run: |
        set -euo pipefail
        mkdir -p .reference
        curl --fail --silent --show-error --location \
          --proto '=https' --proto-redir '=https' --connect-timeout 30 --max-time 300 \
          --retry 2 --retry-max-time 600 --max-filesize 35368461 \
          --output .reference/wordpress-7.1.3.tar.gz https://wordpress.org/wordpress-7.1.3.tar.gz
        python3 -B experiments/wp-bootstrap-probe/prepare.py
    - name: Fetch fixed Rust host dependencies
      run: |
        set -euo pipefail
        rustup toolchain install 1.94.0 --profile minimal --no-self-update
        cargo fetch --locked --manifest-path experiments/php-wasix-wp-object-cache-probe/Cargo.toml
    - name: Compare object cache API and clean private channel completion
      run: python3 -B experiments/php-wasix-wp-object-cache-probe/run_check.py --record
    - name: Upload only public cache trial evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: wordpress-wasix-object-cache-${{ github.run_attempt }}
        if-no-files-found: warn
        path: experiments/php-wasix-wp-object-cache-probe/evidence/linux.json
