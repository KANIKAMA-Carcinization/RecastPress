      - "experiments/php-wasix-fiber-cgi-probe/native_contract.py"
      - "experiments/php-wasix-fiber-cgi-probe/patch_source.py"
      - "experiments/php-wasix-fiber-probe/build.py"
      - "experiments/php-wasix-fiber-probe/evidence/native-fiber-contract.json"
      - "experiments/php-wasix-fiber-probe/fixtures/fiber_contract.php"
      - "experiments/php-wasix-fiber-probe/fixtures/zend_wasix_fiber.S"
