[package]
name = "recastpress-php-wasix-wp-private-http-probe"
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.10.9", default-features = false }
getrandom = "=0.2.17"
recastpress-wp-private-response-probe = { path = "../wp-private-response-probe" }

[lints.rust]
unsafe_code = "forbid"
