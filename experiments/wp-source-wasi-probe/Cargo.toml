[package]
name = "recastpress-wp-source-wasi-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-2.0-or-later"
publish = false

[workspace]

[dependencies]
recastpress-wp-source-fs-probe = { path = "../wp-source-fs-probe" }
anyhow = "1.0"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
wat = "=1.262.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "io-util"] }
wasmer = { version = "=7.2.0", default-features = false, features = ["sys", "cranelift"] }
wasmer-compiler-cranelift = "=7.2.0"
wasmer-wasix = { version = "=0.702.0", default-features = false, features = ["sys-minimal"] }

[lints.rust]
unsafe_code = "forbid"
