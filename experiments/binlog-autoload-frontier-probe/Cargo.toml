[package]
name = "recastpress-binlog-autoload-frontier-probe"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
recastpress-db = { path = "../../crates/recastpress-db" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
recastpress-core = { path = "../../crates/recastpress-core" }
mysql_async = { path = "../../target/wpdb-rpc-probe/workspace/source/mysql_async-0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12", "binlog"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "io-util", "macros"] }
anyhow = "1.0"

[patch.crates-io]
mysql_common = { path = "../../target/wpdb-rpc-probe/workspace/source/mysql_common-0.37.3" }
