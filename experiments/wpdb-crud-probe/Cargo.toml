[package]
name = "recastpress-wpdb-crud-probe"
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[workspace]

[dependencies]
mysql_async = { path = "../../target/wpdb-rpc-probe/workspace/source/mysql_async-0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12", "binlog"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tokio = { version = "1", features = ["rt", "time"] }

[patch.crates-io]
mysql_common = { path = "../../target/wpdb-rpc-probe/workspace/source/mysql_common-0.37.3" }

[lints.rust]
unsafe_code = "forbid"
